name: package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packaging/**"
      - "run_local.py"
      - "pyproject.toml"
      - ".github/workflows/package.yml"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 onedir
            os: macos-14
            artifact: risk-model-agent-macos-arm64
          - name: Windows x64 onedir
            os: windows-latest
            artifact: risk-model-agent-windows-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[package]"

      - name: Build PyInstaller onedir package
        run: python -m PyInstaller packaging/risk_model_agent.spec --noconfirm --clean

      - name: Verify package files
        shell: bash
        run: test -x dist/risk-model-agent/risk-model-agent || test -f dist/risk-model-agent/risk-model-agent.exe

      - name: Smoke test macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export RISK_AGENT_RUNTIME_DIR="$RUNNER_TEMP/risk-model-agent-runtime"
          ./dist/risk-model-agent/risk-model-agent >"$RUNNER_TEMP/risk-model-agent.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8765/api/health >"$RUNNER_TEMP/health.json"; then
              grep -q '"runtime":"local"' "$RUNNER_TEMP/health.json"
              curl --fail --silent http://127.0.0.1:8765/ >"$RUNNER_TEMP/index.html"
              grep -q '风控建模 Agent' "$RUNNER_TEMP/index.html"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/risk-model-agent.log"
          exit 1

      - name: Smoke test Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:RISK_AGENT_RUNTIME_DIR = Join-Path $env:RUNNER_TEMP "risk-model-agent-runtime"
          $process = Start-Process -FilePath "dist\risk-model-agent\risk-model-agent.exe" -PassThru
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 60; $attempt++) {
              try {
                $health = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/health
                if ($health.StatusCode -eq 200 -and $health.Content -match '"runtime":"local"') {
                  $root = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/
                  if ($root.StatusCode -eq 200 -and $root.Content -match '风控建模 Agent') { $ready = $true; break }
                }
              } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { throw "Windows bundle did not pass the localhost smoke test." }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload packaged directory
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/risk-model-agent
          if-no-files-found: error
