name: Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "frontend/**"
      - "packaging/**"
      - "scripts/**"
      - "run_local.py"
      - "pyproject.toml"
      - ".github/workflows/package.yml"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 13+ Apple Silicon
            os: macos-14
            artifact: risk-model-agent-macos-apple-silicon
          - name: Windows 10/11 x64
            os: windows-latest
            artifact: risk-model-agent-windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify runner architecture
        shell: bash
        run: python -c "import platform; expected = 'arm64' if platform.system() == 'Darwin' else 'AMD64'; actual = platform.machine(); print(actual); assert actual == expected, (actual, expected)"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[package]"
      - run: python scripts/verify_packaging.py
      - run: python -m PyInstaller packaging/risk_model_agent.spec --noconfirm --clean
      - name: Smoke test macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export RISK_AGENT_DATA_DIR="$RUNNER_TEMP/risk-model-agent-data"
          export RISK_AGENT_OPEN_BROWSER=0
          ./dist/risk-model-agent/risk-model-agent >"$RUNNER_TEMP/risk-model-agent.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8765/api/v1/health >"$RUNNER_TEMP/health.json"; then
              grep -q '"runtime":"local"' "$RUNNER_TEMP/health.json"
              curl --fail --silent http://127.0.0.1:8765/ | grep -q '<div id="root"></div>'
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/risk-model-agent.log"
            exit 1
          fi
          python scripts/smoke_packaged_service.py
      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:RISK_AGENT_DATA_DIR = Join-Path $env:RUNNER_TEMP "risk-model-agent-data"
          $env:RISK_AGENT_OPEN_BROWSER = "0"
          $process = Start-Process -FilePath "dist\risk-model-agent\risk-model-agent.exe" -PassThru
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 90; $attempt++) {
              try {
                $health = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/v1/health
                $root = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/
                if ($health.StatusCode -eq 200 -and $health.Content -match '"runtime":"local"' -and $root.Content -match '<div id="root"></div>') {
                  $ready = $true
                  break
                }
              } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { throw "Windows bundle did not pass the localhost smoke test." }
            python scripts/smoke_packaged_service.py
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/risk-model-agent
          if-no-files-found: error
