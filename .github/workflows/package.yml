name: Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "frontend/**"
      - "desktop/**"
      - "packaging/**"
      - "scripts/**"
      - "run_local.py"
      - "pyproject.toml"
      - ".github/workflows/package.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 13+ Apple Silicon
            os: macos-14
            artifact: risk-model-agent-macos-apple-silicon
            artifact_path: |
              dist/risk-model-agent
              dist/package-size-report.json
          - name: Windows 10/11 x64
            os: windows-latest
            artifact: risk-model-agent-windows-x64-installer
            artifact_path: dist/installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows'
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'Windows'
        with:
          workspaces: desktop/src-tauri -> target
          cache-on-failure: true
      - name: Verify runner architecture
        shell: bash
        run: python -c "import platform; expected = 'arm64' if platform.system() == 'Darwin' else 'AMD64'; actual = platform.machine(); print(actual); assert actual == expected, (actual, expected)"
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[package]"
      - run: python scripts/verify_packaging.py
      - run: python scripts/verify_desktop_contract.py
      - run: python -m PyInstaller packaging/risk_model_agent.spec --noconfirm --clean
      - name: 生成并固定 PyInstaller 后端完整性清单
        run: python scripts/create_backend_manifest.py
      - name: 审计冻结目录体积与依赖边界
        shell: bash
        run: >-
          python scripts/audit_package_size.py
          --bundle dist/risk-model-agent
          --output dist/package-size-report.json
          --enforce
      - name: 验证 macOS 冻结包全部算法与 Notebook 契约
        if: runner.os == 'macOS'
        timeout-minutes: 3
        shell: bash
        run: ./dist/risk-model-agent/risk-model-agent --internal-package-self-test
      - name: 验证 Windows 冻结包全部算法与 Notebook 契约
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $SelfTest = Start-Process `
            -FilePath .\dist\risk-model-agent\risk-model-agent.exe `
            -ArgumentList @("--internal-package-self-test") `
            -Wait `
            -PassThru
          if ($SelfTest.ExitCode -ne 0) {
            throw "Windows 冻结包内部自检失败，退出码 $($SelfTest.ExitCode)。"
          }
      - name: Smoke test macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export RISK_AGENT_DATA_DIR="$RUNNER_TEMP/risk-model-agent-data"
          export RISK_AGENT_OPEN_BROWSER=0
          ./dist/risk-model-agent/risk-model-agent >"$RUNNER_TEMP/risk-model-agent.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8765/api/v1/health >"$RUNNER_TEMP/health.json"; then
              grep -q '"runtime":"local"' "$RUNNER_TEMP/health.json"
              curl --fail --silent http://127.0.0.1:8765/ | grep -q '<div id="root"></div>'
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/risk-model-agent.log"
            exit 1
          fi
          python scripts/smoke_packaged_service.py
      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          .\scripts\smoke_windows_service.ps1
          -ExecutablePath dist\risk-model-agent\risk-model-agent.exe
          -DataDirectory (Join-Path $env:RUNNER_TEMP "risk-model-agent-data")
      - name: 下载并校验真实 1.1.2 Inno 迁移夹具
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\prepare_legacy_inno_fixture.ps1
      - name: 构建 Tauri Windows 客户端与 NSIS 安装包
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 30
        run: .\scripts\build_windows_tauri.ps1
      - name: 收集并校验唯一正式 Tauri 安装器
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\collect_tauri_installer.ps1
      - name: 执行 Windows 安装包体积硬门禁
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python scripts/audit_package_size.py
          --bundle dist/risk-model-agent
          --installer dist/installer
          --output dist/installer/package-size-report.json
          --baseline-kib 239176
          --maximum-mib 180
          --minimum-reduction-percent 25
          --enforce
      - name: 迁移、首次工作区、恢复、建模评分并卸载 Tauri 客户端
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 30
        run: >-
          .\scripts\smoke_windows_tauri_installer.ps1
          -LegacyInstallerPath dist\fixtures\legacy-inno\RiskModelAgent-1.1.2-windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30
