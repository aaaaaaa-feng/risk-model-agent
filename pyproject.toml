[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-model-agent"
version = "0.1.0"
description = "A local-first, human-approved credit-risk modeling agent."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Risk Model Agent contributors" }]
dependencies = [
  "fastapi>=0.115,<0.117",
  "jinja2>=3.1,<4",
  "joblib>=1.4,<2",
  "pandas>=2.2,<2.3",
  "python-multipart>=0.0.12,<0.1",
  "scikit-learn>=1.5,<1.7",
  "uvicorn>=0.32,<0.36",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.29",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]
