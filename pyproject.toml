[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-model-agent"
version = "0.1.0"
description = "Local-first binary risk modeling workbench with guarded Agent orchestration"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "langgraph>=0.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
risk-model-agent = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
