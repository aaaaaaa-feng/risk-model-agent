[build-system]
requires = ["setuptools>=58"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-model-agent"
version = "1.0.2"
description = "Local-first binary consumer-credit risk modeling Agent workbench"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pandas>=2.1",
  "polars>=1.0",
  "duckdb>=1.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "lightgbm>=4.3",
  "catboost>=1.2",
  "skops>=0.10",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "python-multipart>=0.0.9",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "httpx>=0.27",
  "cryptography>=43",
  "keyring>=25",
  "psutil>=6",
  "nbformat>=5.10",
  "jupyter-client>=8.6",
  "ipykernel>=6.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.12"]
package = ["pyinstaller>=6.0"]

[project.scripts]
risk-model-agent = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
