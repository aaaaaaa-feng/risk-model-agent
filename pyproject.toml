[build-system]
requires = ["setuptools>=58"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-model-agent"
version = "1.2.1"
description = "Local-first binary consumer-credit risk modeling Agent workbench"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  # 桌面版只使用本机 HTTP/SSE，不因 Uvicorn 额外引入 reload 和高性能事件循环。
  "uvicorn>=0.30,<1",
  "pandas>=2.1",
  "duckdb>=1.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  # XGBoost 3.2 的 Windows 原生库比 3.1.3 大约 36.8 MB，而 V1 未使用其新增能力。
  # 解除上限前必须重新通过八模型冻结自检、完整评分冒烟和安装包体积门禁。
  "xgboost>=2.0,<3.2",
  "lightgbm>=4.3",
  "catboost>=1.2",
  "skops>=0.10",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "python-multipart>=0.0.9",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "httpx>=0.27",
  "cryptography>=43",
  "keyring>=25",
  "psutil>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.12"]
# 打包工具与运行时依赖分开，避免普通开发环境携带冻结工具链。
package = [
  "pyinstaller>=6.11,<7",
  "pyinstaller-hooks-contrib>=2025.10,<2027",
  # 仅用于 Windows CI 通过 WebView2 CDP 取得真实 HttpOnly 会话并冒烟。
  "websockets>=14,<17",
]

[project.scripts]
risk-model-agent = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
