<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>风控建模 Agent</title>
    <script>
      /* 首帧前写入 data-theme；Cookie 跨随机端口，localStorage 兼容旧版本。 */
      try {
        var match = document.cookie.match(/(?:^|; )rma_ui_risk-agent-theme=([^;]*)/);
        var stored = match ? decodeURIComponent(match[1]) : localStorage.getItem("risk-agent-theme");
        document.documentElement.dataset.theme =
          stored === "light" || stored === "dark"
            ? stored
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
